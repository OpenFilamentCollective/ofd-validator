name: Build and Publish npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish-to-npm:
        description: 'Publish to npm (true/false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: crates/ofd-validator-js/package-lock.json

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies
        working-directory: crates/ofd-validator-js
        run: npm install

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build native addon
        working-directory: crates/ofd-validator-js
        run: npx napi build --release --platform --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.target }}
          path: crates/ofd-validator-js/*.node
          retention-days: 7

      - name: Upload JS loader
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: js-loader
          path: |
            crates/ofd-validator-js/index.js
            crates/ofd-validator-js/index.d.ts
          retention-days: 7

  test:
    name: Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binding-*
          merge-multiple: true
          path: crates/ofd-validator-js

      - name: Download JS loader
        uses: actions/download-artifact@v4
        with:
          name: js-loader
          path: crates/ofd-validator-js

      - name: Install dependencies
        working-directory: crates/ofd-validator-js
        run: npm install

      - name: Smoke test
        working-directory: crates/ofd-validator-js
        shell: bash
        run: |
          node -e "
          const v = require('./index');
          console.log('Available exports:', Object.keys(v));

          // Test that all path-mode functions exist
          console.assert(typeof v.validateAll === 'function', 'validateAll missing');
          console.assert(typeof v.validateJsonFiles === 'function', 'validateJsonFiles missing');
          console.assert(typeof v.validateLogoFiles === 'function', 'validateLogoFiles missing');
          console.assert(typeof v.validateFolderNames === 'function', 'validateFolderNames missing');
          console.assert(typeof v.validateStoreIds === 'function', 'validateStoreIds missing');
          console.assert(typeof v.validateGtinEan === 'function', 'validateGtinEan missing');
          console.assert(typeof v.validateRequiredFiles === 'function', 'validateRequiredFiles missing');
          console.assert(typeof v.validateLogoFile === 'function', 'validateLogoFile missing');
          console.assert(typeof v.validateFolderName === 'function', 'validateFolderName missing');

          // Test that all content-mode functions exist
          console.assert(typeof v.validateJsonContent === 'function', 'validateJsonContent missing');
          console.assert(typeof v.validateLogoContent === 'function', 'validateLogoContent missing');
          console.assert(typeof v.validateFolderNameContent === 'function', 'validateFolderNameContent missing');
          console.assert(typeof v.validateGtinEanContent === 'function', 'validateGtinEanContent missing');
          console.assert(typeof v.validateStoreIdsContent === 'function', 'validateStoreIdsContent missing');
          console.assert(typeof v.validateAllContent === 'function', 'validateAllContent missing');

          console.log('All smoke tests passed');
          "

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish-to-npm == 'true')
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binding-*
          merge-multiple: true
          path: crates/ofd-validator-js/artifacts

      - name: Download JS loader
        uses: actions/download-artifact@v4
        with:
          name: js-loader
          path: crates/ofd-validator-js

      - name: Install dependencies
        working-directory: crates/ofd-validator-js
        run: npm install

      # Move each built .node from artifacts/ into its npm/<platform>/ package.
      # Without this the platform packages publish WITHOUT their binary.
      - name: Copy binaries into platform packages
        working-directory: crates/ofd-validator-js
        run: npx napi artifacts

      # NB: `napi prepublish` is intentionally NOT used — it publishes the platform packages
      # itself, but without NODE_AUTH_TOKEN in its env (setup-node writes an .npmrc that
      # expands ${NODE_AUTH_TOKEN} at run time), so it publishes unauthenticated -> 404.
      # `napi artifacts` above already placed each binary; we publish explicitly below with
      # the token in scope.

      # Guard: never publish an empty platform package (each must contain its .node).
      - name: Verify each platform package contains its binary
        working-directory: crates/ofd-validator-js
        run: |
          fail=0
          for dir in npm/*/; do
            main=$(node -p "require('./$dir/package.json').main")
            if [ ! -f "$dir$main" ]; then echo "MISSING binary: $dir$main"; fail=1; fi
          done
          [ "$fail" = "0" ] || { echo "Refusing to publish — platform package(s) missing their .node"; exit 1; }

      - name: List packages
        working-directory: crates/ofd-validator-js
        run: ls -lhR npm/ artifacts/ 2>/dev/null || true

      - name: Publish platform packages
        working-directory: crates/ofd-validator-js
        run: |
          for dir in npm/*/; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "Skip $name@$version (already published)"
            else
              echo "Publishing $name@$version"
              ( cd "$dir" && npm publish --access public --provenance )
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        working-directory: crates/ofd-validator-js
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "Skip $name@$version (already published)"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
